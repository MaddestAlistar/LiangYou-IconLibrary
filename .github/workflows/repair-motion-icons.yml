name: Restore motion icon quality

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-motion-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-motion-gifs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out icon library
        uses: actions/checkout@v4
      - name: Ensure FFmpeg
        shell: bash
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Rebuild the ten GIFs from original Motion JPGs
        run: python3 maintenance/repair_motion_icons.py
      - name: Commit optimized replacements
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/liangyou/*-animated-01.gif
          if git diff --cached --quiet; then
            echo "No changed GIFs"
            exit 0
          fi
          git commit -m "Improve color and frame rate of ten motion icons"
          git push origin HEAD:main
